version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"

    open-pull-requests-limit: 8

    versioning-strategy: "increase"

    commit-message:
      prefix: "deps"
      include: "scope"

    labels:
      - "dependencies"
      - "worker"

    groups:

      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"

      paypal:
        patterns:
          - "@paypal/*"
          - "paypal*"

      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "jest*"
          - "@types/jest"

      linting:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"

      build-tools:
        patterns:
          - "typescript"
          - "tsx"
          - "rollup*"
          - "esbuild"
          - "vite*"

      utilities:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "UTC"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "ci"

    labels:
      - "github-actions"
      - "dependencies"

  # Docker (optional)
  #
  # Uncomment if your Worker project later adds Docker support.
  #
  # - package-ecosystem: "docker"
  #   directory: "/"
  #
  #   schedule:
  #     interval: "monthly"
  #
  #   open-pull-requests-limit: 2# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
